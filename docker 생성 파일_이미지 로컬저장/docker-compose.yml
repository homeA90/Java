version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: hrbank-db
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_PORT}:${DB_PORT}"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - app-network

  hrbank-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hrbank-app
    volumes:
      - hrbank-binary-data:/local-storages
    environment:
      # DB
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
    ports:
      - "33000:8080" # prod-8081:80 or dev-8081:8080
    depends_on:
      - postgres
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
volumes:
  postgres-data:
  hrbank-binary-data: